<h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 26px; font-weight: 900; color: #1F4D3A">이번 주 식단</h1>
<p style="margin: 0; font-size: 14px; color: #4F4A44">매일 새벽 4:30부터 조리합니다. 식단은 재료 수급에 따라 바뀔 수 있습니다.</p>

<script>
/* 식단 데이터: 날짜(YYYY-MM-DD)별로 조식·중식·석식을 적습니다. 비어 있으면 "준비 중"으로 보입니다.
   예) "2026-10-26": { "조식": "흰밥, 북엇국, 계란말이, 김치", "중식": "...", "석식": "..." } */
var MENU = {};

(function () {
  var DOW = ['일','월','화','수','목','금','토'];
  function kstToday() { var n = new Date(Date.now() + 9*3600e3); return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate())); }
  function key(d) { return d.toISOString().slice(0,10); }
  function md(d) { return (d.getUTCMonth()+1) + '/' + d.getUTCDate(); }
  var today = kstToday();
  var offset = 0;
  function render() {
    var mon = new Date(today); var dow = (today.getUTCDay() + 6) % 7; mon.setUTCDate(today.getUTCDate() - dow + offset*7);
    var sun = new Date(mon); sun.setUTCDate(mon.getUTCDate() + 6);
    document.getElementById('range').textContent = (offset === 0 ? '이번 주 · ' : offset === 1 ? '다음 주 · ' : offset === -1 ? '지난주 · ' : '') + md(mon) + ' ~ ' + md(sun);
    var box = document.getElementById('days'); box.innerHTML = ''; var any = false;
    for (var i = 0; i < 7; i++) {
      var d = new Date(mon); d.setUTCDate(mon.getUTCDate() + i);
      var m = MENU[key(d)] || {};
      var isSun = d.getUTCDay() === 0;
      var meals = isSun ? ['중식'] : ['조식','중식','석식'];
      var el = document.createElement('article'); el.className = 'day' + (key(d) === key(today) ? ' today' : '');
      var head = '<div style="display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px;background:#F6F1E8">'
        + '<strong style="font-size:16px">' + md(d) + ' (' + DOW[d.getUTCDay()] + ')' + (key(d) === key(today) ? ' <span style="font-size:12px;color:#C2491B">오늘</span>' : '') + '</strong>'
        + (isSun ? '<span style="font-size:12px;color:#4F4A44">일요일은 점심 배달만</span>' : '') + '</div>';
      var rows = meals.map(function (k) {
        var v = m[k]; if (v) any = true;
        return '<div class="meal"><b>' + k + '</b><span class="' + (v ? '' : 'tbd') + '">' + (v ? String(v).replace(/[<>&]/g, '') : '준비 중') + '</span></div>';
      }).join('');
      el.innerHTML = head + rows; box.appendChild(el);
    }
    document.getElementById('notice').style.display = any ? 'none' : 'block';
  }
  document.getElementById('prev').onclick = function () { if (offset > -1) { offset--; render(); } };
  document.getElementById('next').onclick = function () { if (offset < 1) { offset++; render(); } };
  render();
})();
</script>
