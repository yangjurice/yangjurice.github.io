<script>
/* 점심 식단 데이터: 날짜(YYYY-MM-DD)별로 [구분, 메뉴] 목록을 적습니다. 비어 있으면 "준비 중"으로 보입니다.
   예) "2026-10-26": [["국/찌개","맑은콩나물국"],["메인","닭갈비"],["서브메인","김치전"],["반찬","시금치나물"],["반찬","감자채볶음"],["김치","배추김치"]] */
var MENU = {};

(function () {
  var DOW = ['일','월','화','수','목','금','토'];
  function kstToday() { var n = new Date(Date.now() + 9*3600e3); return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate())); }
  function key(d) { return d.toISOString().slice(0,10); }
  function md(d) { return (d.getUTCMonth()+1) + '/' + d.getUTCDate(); }
  var esc = function (v) { return String(v).replace(/[<>&]/g, ''); };
  var today = kstToday();
  var mon = new Date(today); mon.setUTCDate(today.getUTCDate() - (today.getUTCDay() + 6) % 7);
  var week = []; for (var i = 0; i < 7; i++) { var d = new Date(mon); d.setUTCDate(mon.getUTCDate() + i); week.push(d); }
  var sel = key(today);
  var chips = document.getElementById('chips'), card = document.getElementById('card');

  function draw() {
    chips.innerHTML = week.map(function (d) {
      var k = key(d), on = k === sel, isToday = k === key(today);
      return '<button type="button" role="tab" aria-selected="' + on + '" data-k="' + k + '" style="display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;padding:6px 0;border-radius:10px;font:inherit;cursor:pointer;'
        + (on ? 'background:#1F4D3A;color:#fff;border:1px solid #1F4D3A' : 'background:#fff;color:#1C2420;border:1px solid #CFC8BC') + '">'
        + '<span style="font-size:13px;font-weight:700">' + DOW[d.getUTCDay()] + '</span>'
        + '<span style="font-size:12px">' + (isToday ? '오늘' : md(d)) + '</span></button>';
    }).join('');
    var d = week.filter(function (x) { return key(x) === sel; })[0];
    var m = MENU[sel] || [];
    var head = '<div style="display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px;background:#F6F1E8">'
      + '<strong style="font-size:18px">' + md(d) + ' (' + DOW[d.getUTCDay()] + ')' + (sel === key(today) ? ' <span style="font-size:13px;color:#C2491B">오늘</span>' : '') + '</strong>'
      + '<span style="font-size:13px;color:#4F4A44">점심</span></div>';
    var rows = m.length
      ? m.map(function (it) { return '<div class="meal"><b>' + esc(it[0]) + '</b><span>' + esc(it[1]) + '</span></div>'; }).join('')
      : '<div class="meal" style="flex-direction:column;gap:4px;padding:22px 16px"><span class="tbd" style="font-size:16px">식단 준비 중입니다.</span><span style="font-size:13px;color:#6B645C">궁금하신 메뉴는 010-8115-9671로 문의해 주세요.</span></div>';
    card.className = 'day' + (sel === key(today) ? ' today' : '');
    card.innerHTML = head + rows;
  }
  chips.addEventListener('click', function (e) { var b = e.target.closest('button[data-k]'); if (b) { sel = b.getAttribute('data-k'); draw(); } });
  draw();
})();
</script>
